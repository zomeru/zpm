[alias]
# formatting
format = "fmt --all"
format-check = "fmt --all -- --check"
fmt-check = "fmt --all -- --check"

# linting
lint = "clippy --all-targets --all-features -- -D warnings"
check-all = "check --all-targets --all-features"

# testing
test-all = "test --all-features"

# building
build-release = "build --release"
build-rel = "build --release"

# running (pass extra args after `--`, e.g. `cargo dev -- --help`)
dev = "run --"
run-with = "run --"

# quick checks (single cargo invocation)
check-fmt = "fmt --all -- --check"
