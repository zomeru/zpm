name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check
        run: cargo check --all-targets --all-features
      - name: Tests (unit + integration)
        run: cargo test --all-features
      - name: Doc tests
        run: cargo test --doc
      - name: Build (debug)
        run: cargo build --all-features
      - name: Build (release)
        run: cargo build --release

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked || true
      - name: Coverage summary
        run: cargo llvm-cov --all-features --summary-only
      # HTML artifact is uploadable for inspection but not enforced to 100% until exclusions are finalized
      - name: Coverage HTML (artifact)
        run: cargo llvm-cov --all-features --html || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: target/llvm-cov/html
          if-no-files-found: ignore

  advisories:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --all-features
          log-level: warn
        continue-on-error: true

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Verify MSRV
        run: cargo test --all-features
